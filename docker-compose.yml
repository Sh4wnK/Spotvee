services:
  spotvee:
    build: .
    image: spotvee:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPOTVEE_TOKEN_FILE: /data/spotvee-state.json
      SPOTVEE_TOKEN_KEY_FILE: /data/.spotvee-token-key
    volumes:
      - spotvee-state:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  spotvee-state: